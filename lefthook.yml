commit-msg:
  jobs:
    - name: commitlint
      run: cd apps/desktop && bunx commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: rustfmt
      glob: "*.rs"
      root: apps/desktop/src-tauri
      run: cargo fmt -- --check

    - name: clippy
      glob: "*.rs"
      root: apps/desktop/src-tauri
      run: cargo clippy -- -D warnings

    - name: gofmt
      glob: "*.go"
      root: apps/desktop/src-sidecar
      run: gofmt -l -d {staged_files}

    - name: eslint
      glob: "*.{ts,tsx}"
      root: apps/desktop
      run: bunx eslint {staged_files}

    - name: prettier
      glob: "*.{ts,tsx,js,json,css,html,md,yml,yaml}"
      run: bunx prettier --check {staged_files}

    - name: tsc
      glob: "*.{ts,tsx}"
      root: apps/desktop
      run: bunx tsc --noEmit

# Each suite runs only when the push touches its part of the repo; CI runs
# everything again. In lefthook `**` means one or more folders, so each area
# lists its top level and its subfolders.
pre-push:
  parallel: true
  jobs:
    - name: cargo-test
      root: apps/desktop/src-tauri
      glob:
        - "apps/desktop/src-tauri/*"
        - "apps/desktop/src-tauri/**/*"
      run: cargo test

    - name: go-test
      root: apps/desktop/src-sidecar
      glob:
        - "apps/desktop/src-sidecar/*"
        - "apps/desktop/src-sidecar/**/*"
      run: go test ./...

    - name: vitest
      root: apps/desktop
      glob:
        - "apps/desktop/src/*"
        - "apps/desktop/src/**/*"
        - "apps/desktop/*.{ts,js,json}"
      run: bunx vitest run
