coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%

flags:
  rust:
    paths:
      - apps/desktop/src-tauri/
    carryforward: true
  go:
    paths:
      - apps/desktop/src-sidecar/
    carryforward: true
  typescript:
    paths:
      - apps/desktop/src/
    carryforward: true

ignore:
  - "apps/desktop/src-tauri/target/"
  - "apps/desktop/src-tauri/gen/"
  - "apps/desktop/node_modules/"
  - "apps/desktop/dist/"
  - "apps/desktop/src-sidecar/cmd/" # entry-point shims; logic lives in internal/sidecar
  - "apps/desktop/src-sidecar/internal/youtube/ytpb/" # generated protobuf/grpc bindings
  - "apps/desktop/src-tauri/src/lib.rs" # tauri entry + setup wiring; logic lives in host.rs
  - "apps/desktop/src-tauri/src/main.rs" # 3-line binary shim
  - "apps/desktop/src-tauri/src/twitch_auth/commands.rs" # thin #[tauri::command] adapters; logic lives in auth_state.rs
  - "apps/desktop/src-tauri/src/storage_move/commands.rs" # thin #[tauri::command] adapters; logic lives in storage_move/mod.rs
  - "apps/desktop/src-tauri/src/user_card/commands.rs" # card window commands and wiring; logic lives in user_card/mod.rs
  - "apps/desktop/src-tauri/src/launch_update.rs" # startup window builder + #[tauri::command] adapters; the flow lives in src/lib/launchUpdate.ts

comment:
  layout: "reach,diff,flags"
  behavior: default
  require_changes: false
