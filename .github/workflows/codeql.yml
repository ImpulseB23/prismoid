name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/src-sidecar/**"
      - "apps/desktop/src/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/src-sidecar/**"
      - "apps/desktop/src/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # The Rust analysis takes eight minutes, most of it query evaluation
        # that no cache can shorten, so it runs on main and on the weekly
        # schedule while the one-minute Go and JS analyses stay on PRs.
        language: ${{ fromJSON(github.event_name == 'pull_request' && '["go", "javascript-typescript"]' || '["go", "javascript-typescript", "rust"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
