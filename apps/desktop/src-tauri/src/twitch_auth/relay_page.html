<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prismoid sign-in</title>
    <style>
      :root {
        color-scheme: dark light;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: #111;
        color: #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      main {
        text-align: center;
        max-width: 420px;
        padding: 32px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Finishing sign-in</h1>
      <p id="detail">One moment.</p>
    </main>
    <script>
      (async () => {
        const title = document.getElementById("title");
        const detail = document.getElementById("detail");
        const fragment = location.hash.slice(1);
        if (!fragment) {
          title.textContent = "Nothing to finish here.";
          detail.textContent = "Start the sign-in from Prismoid.";
          return;
        }
        try {
          const response = await fetch("/callback", {
            method: "POST",
            headers: { "content-type": "application/x-www-form-urlencoded" },
            body: fragment,
          });
          const text = await response.text();
          history.replaceState(null, "", "/");
          if (response.ok) {
            document.open();
            document.write(text);
            document.close();
          } else {
            title.textContent = "Sign-in did not go through.";
            detail.textContent = text;
          }
        } catch {
          title.textContent = "Prismoid is not listening.";
          detail.textContent =
            "Go back to the app and start the sign-in again.";
        }
      })();
    </script>
  </body>
</html>
