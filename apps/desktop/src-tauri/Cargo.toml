[package]
name = "prismoid"
version = "0.8.5"
edition = "2021"

[lib]
name = "prismoid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dotenvy = "0.15"
keyring = { version = "3", default-features = false }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "query",
] }
twitch_oauth2 = { version = "0.17", default-features = false, features = ["reqwest"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "time", "net", "io-util", "sync"] }
tracing = { version = "0.1", features = ["log"] }
aho-corasick = "1.1"
arc-swap = "1.7"
rustc-hash = "2.1"
sha2 = "0.11"
base64 = "0.22"
getrandom = "0.4"
url = "2"
tauri-plugin-window-state = "2.5.0"
futures-util = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }
tauri-plugin-process = "2.4"
tauri-plugin-log = "2"
log = "0.4"
os_info = { version = "3", default-features = false }
regex = "1"
tauri-plugin-clipboard-manager = "2.5.0"

[dev-dependencies]
criterion = "0.8"
httpmock = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.7.0"
tauri-plugin-deep-link = "2.6"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }

[features]
# Opt-in feature that exposes internal write + parse helpers to the
# bench binary. Never enable in a release build; the exposed surface
# includes raw ring-write primitives that skip back-pressure.
__bench = []

[[bench]]
name = "drain_throughput"
harness = false
required-features = ["__bench"]

# Thin LTO with parallel codegen cuts the release compile by well over
# half for about ten percent more binary; fat LTO re-optimised every crate
# at the final link on each release.
[profile.release]
lto = "thin"
strip = true
opt-level = "s"

# Until tauri-apps/plugins-workspace takes the fix: a fullscreen window's
# size and position are not saved, so a launch after quitting in fullscreen
# opens at the normal window size.
[patch.crates-io]
tauri-plugin-window-state = { git = "https://github.com/ImpulseB23/plugins-workspace", rev = "d6580ce4575e76a37cc16954098ed92c947db9d5" }
